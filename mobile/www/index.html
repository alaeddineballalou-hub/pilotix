<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Pilotix</title>
  <!-- The app's start page. It opens https://pilotix.online, or the backup door https://direct.pilotix.online when the main road is cut (door.js). -->
  <link rel="stylesheet" href="door.css" />
</head>
<body>
  <main>
    <!-- the Pilotix app icon (same drawing as apps/web/public/icon.svg) -->
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" rx="112" fill="#fff"/></mask><g mask="url(#m)"><rect width="512" height="512" fill="#1B2A47"/><path d="M0,250 C120,200 200,320 300,280 C380,248 440,230 512,250 V512 H0 Z" fill="#F7A823"/></g><path d="M146.00,296.00 C217.40,372.00 324.50,364.40 384.00,272.00 C324.50,319.18 217.40,326.78 146.00,296.00 Z" fill="#1B2A47"/><circle cx="186" cy="186" r="50" fill="#F7A823"/><path d="M290,186 H364" stroke="#F7A823" stroke-width="44" stroke-linecap="round" fill="none"/></svg>

    <div class="dot" aria-hidden="true">
      <div class="spin" id="ico-spin"></div>
      <!-- no internet: wifi with a slash -->
      <svg id="ico-net" viewBox="0 0 24 24" fill="none" stroke="#F7A823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 14 0"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/><path d="M3 3l18 18"/></svg>
      <!-- internet works but the road to Pilotix is cut: a broken link -->
      <svg id="ico-cut" viewBox="0 0 24 24" fill="none" stroke="#F7A823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M9.5 6.5l1.6-1.6a4.2 4.2 0 0 1 6 6l-1.6 1.6"/><path d="M14.5 17.5l-1.6 1.6a4.2 4.2 0 0 1-6-6l1.6-1.6"/><path d="M5 5l-2-2"/><path d="M19 19l2 2"/><path d="M4 9H2"/><path d="M20 15h2"/></svg>
      <!-- the server doesn't answer: a cloud with a mark -->
      <svg id="ico-srv" viewBox="0 0 24 24" fill="none" stroke="#F7A823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.5 19H8a5 5 0 1 1 .9-9.9A6 6 0 0 1 20 11.5a3.75 3.75 0 0 1-2.5 7.5z"/><path d="M12 11v3"/><circle cx="12" cy="16.5" r=".6"/></svg>
    </div>

    <h1 id="title"></h1>
    <p id="text"></p>
    <button id="retry" type="button" hidden></button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <div class="build" id="build" hidden></div>

  <script>window.PILOTIX_PAGE = 'start';</script>
  <script src="build.js"></script>
  <script src="splash.js"></script>
  <script src="door.js"></script>
</body>
</html>
