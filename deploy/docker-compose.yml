# Production: PostgreSQL + Redis + the Pilotix server + the website behind Caddy (HTTPS).
# Settings come from deploy/.env (made by deploy/install.sh). Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: pilotix
# each service's log is kept small: 5 files of 10 MB at most, the oldest dropped (the disk never fills with logs)
x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
services:
  postgres:
    <<: *logs
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pilotix
      POSTGRES_USER: pilotix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotix"]
      interval: 5s
      retries: 20

  redis:
    <<: *logs
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  server:
    <<: *logs
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://pilotix:${POSTGRES_PASSWORD}@postgres:5432/pilotix
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?missing in deploy/.env}
      # seals the secrets saved in the database (made by install.sh; never change it: apps/server/src/secretbox.ts)
      DATA_KEY: ${DATA_KEY:-}
      JWT_EXPIRES: 12h
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN},capacitor://localhost,https://localhost
      TRUST_PROXY: "1"
      PUBLIC_URL: https://${DOMAIN}
      # the landing pages' own address (deploy/Caddyfile › go.<domain>): used once it answers, else the pages stay on PUBLIC_URL
      LANDING_URL: https://go.${DOMAIN}
      # its check goes to Caddy here (same name, same certificate check): through Cloudflare, its bot protection stops it
      LANDING_CHECK_VIA: web
      # shops' own domains point to this server's address: set it when the domain is behind Cloudflare (its DNS shows
      # Cloudflare's addresses, not the server's). Several: comma-separated.
      PUBLIC_IP: ${PUBLIC_IP:-}
      # e-mails ("mot de passe oublié"): put these lines in deploy/.env, then run the installer again
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # emergency only (the login code e-mails cannot leave): PLATFORM_TWO_STEP=off in deploy/.env
      PLATFORM_TWO_STEP: ${PLATFORM_TWO_STEP:-}
    # the nightly backups (read only): the control room shows the last one and the disk space left
    volumes: ["/opt/pilotix-backups:/backups:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    <<: *logs
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        DOMAIN: ${DOMAIN}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddydata:/data, caddyconfig:/config]
    depends_on: [server]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
