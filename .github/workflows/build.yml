name: Pilotix CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    name: Web server configuration (Caddy validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -e DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  core:
    name: Core rules (tests on PostgreSQL in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # a failing test shows as one annotation on the run (its name and the assertion), readable without the raw log
      - run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || { msg=$(grep -E "not ok|✖|Error|expected|actual|^\s+[-+] " test.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'); echo "::error title=Failing tests::$msg"; exit 1; }

  server:
    name: Server (PostgreSQL 16 + end-to-end test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pilotix
          POSTGRES_USER: pilotix
          POSTGRES_PASSWORD: pilotix_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pilotix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://pilotix:pilotix_ci@localhost:5432/pilotix
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      # e-mails go to a test mailbox (scripts/smtp-sink.cjs): invitations, sign-up links, codes, receipts are checked
      PUBLIC_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2525'
      MAIL_FROM: Pilotix <noreply@pilotix.test>
      MAILS_DIR: /tmp/mails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @pilotix/shared && npm run build -w @pilotix/core && npm run build -w @pilotix/server
      - run: npm run migrate -w @pilotix/server
      - run: npm run seed:demo -w @pilotix/server
      - name: Start server
        run: |
          node scripts/smtp-sink.cjs 2525 /tmp/mails > mails.log 2>&1 &
          node apps/server/dist/main.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
      - name: End-to-end test
        run: bash scripts/smoke-test.sh
      - name: End-to-end test of the multi-shop server (accounts, control room, sign-up, store picker, limits, receipts, domains)
        run: node scripts/shops-test.mjs
      - name: End-to-end test of the two Doctors (server health + Pilotix Doctor of a shop)
        run: node scripts/doctor-test.mjs
      - name: End-to-end test of the public Pro marketers page
        run: |
          curl -fs http://localhost:3000/api/pro | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);if(!Array.isArray(d.pros))process.exit(1);console.log('pros',d.pros.length)})"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/pro/MK-ZZZZ)" = "404"
      - if: failure()
        run: cat server.log; tail -50 mails.log

  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build for GitHub Pages (with the demo)
        run: npm run build -w @pilotix/web
        env:
          VITE_BASE: /pilotix/
          VITE_DEMO: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  preview:
    name: Demo preview (for Claude)
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:artifact -w @pilotix/web
      - name: Publish to the artifact-build branch
        run: |
          cp -r apps/web/dist-artifact /tmp/out && cd /tmp/out
          git init -q -b artifact-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Demo preview from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifact-build

  # GitHub Pages is not turned on for this repository (the site is pilotix.online): the job ran red on every push.
  # It runs only once Pages is on and the repository variable PAGES is set to « on » (Settings › Variables).
  pages:
    name: Website (GitHub Pages)
    if: github.ref == 'refs/heads/main' && vars.PAGES == 'on'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # The Android and iPhone apps are built by mobile.yml, only when mobile/ changes (the app opens the live site).
