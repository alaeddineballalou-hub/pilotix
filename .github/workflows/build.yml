name: Pilotix CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    name: Web server configuration (Caddy validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -e DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  core:
    name: Core rules (tests on PostgreSQL in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  server:
    name: Server (PostgreSQL 16 + end-to-end test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pilotix
          POSTGRES_USER: pilotix
          POSTGRES_PASSWORD: pilotix_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pilotix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://pilotix:pilotix_ci@localhost:5432/pilotix
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @pilotix/shared && npm run build -w @pilotix/core && npm run build -w @pilotix/server
      - run: npm run migrate -w @pilotix/server
      - run: npm run seed:demo -w @pilotix/server
      - name: Start server
        run: |
          node apps/server/dist/main.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
      - name: End-to-end test
        run: bash scripts/smoke-test.sh
      - name: End-to-end test of the multi-shop server (sign-up, users, store picker, passwords, domains)
        run: node scripts/shops-test.mjs
      - if: failure()
        run: cat server.log

  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build for GitHub Pages (with the demo)
        run: npm run build -w @pilotix/web
        env:
          VITE_BASE: /pilotix/
          VITE_DEMO: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  preview:
    name: Demo preview (for Claude)
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:artifact -w @pilotix/web
      - name: Publish to the artifact-build branch
        run: |
          cp -r apps/web/dist-artifact /tmp/out && cd /tmp/out
          git init -q -b artifact-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Demo preview from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifact-build

  pages:
    name: Website (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @pilotix/web
      - name: Create and sync Android project
        working-directory: apps/web
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pilotix-android-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (simulator build)
    # Mac runners are not always available on this account: run it from Actions → "Run workflow".
    if: github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @pilotix/web
      - name: Create and sync iOS project
        working-directory: apps/web
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Build for iOS simulator (unsigned)
        working-directory: apps/web/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -r ../../../../pilotix-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: pilotix-ios-simulator-app
          path: apps/web/ios/App/pilotix-ios-simulator.zip
