name: Package cache (for offline development)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Pack node_modules and push to the deps-cache branch
        run: |
          tar -czf /tmp/nm.tgz node_modules apps/*/node_modules packages/*/node_modules 2>/dev/null || tar -czf /tmp/nm.tgz node_modules
          mkdir /tmp/out && cd /tmp/out
          split -b 45m -d /tmp/nm.tgz nm.tgz.part-
          cp $GITHUB_WORKSPACE/package.json $GITHUB_WORKSPACE/package-lock.json . 2>/dev/null || true
          ls -la
          git init -q -b deps-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "node_modules from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deps-cache
