# Puts the latest main live on pilotix.online: backs up the database, then updates the server (about 3-5 minutes; the
# site pauses while the server restarts).
# The owner's rule (11 Nov 2026): never during the day — the agents work in Pilotix all day and each update made them
# drop — and nothing goes live without the owner's yes.
# The owner looks at every update on his « Pilotix Deploy » page (a Claude artifact) and presses « Déployer cette
# nuit ». At 00:00 Algiers time a Claude scheduled task reads that yes and starts this workflow with source=page:
# then the latest main goes live only if it is the version he said yes to, Pilotix CI passed on it, and it is not
# live yet. No yes = nothing goes live. (Until 11 Nov 2026 this ran by itself every night at 03:17: removed.)
# Urgent only (the site is down, a fix cannot wait for the night), and only when the owner asks: Actions > Deploy to
# the server > Run workflow with source=urgent (or `gh workflow run deploy.yml -f source=urgent`).
# Needs the secrets DEPLOY_HOST and DEPLOY_SSH_KEY, made by deploy/setup-github-deploy.sh on the server.
# The key can run only deploy/update.sh on the server: nothing else, even if it leaked.
name: Deploy to the server

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'page = the owner said yes on the Pilotix Deploy page (checks CI first); urgent = the owner asked, right now'
        type: choice
        options: [page, urgent]
        default: page
      sha:
        description: 'source=page: the main version the owner said yes to (the run stops if main is not that version)'
        type: string
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # the night's update only goes on with something new on main that CI passed (a red main waits for its fix)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.what.outputs.go }}
    steps:
      - name: Something new to put live, checked by CI?
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source }}
          YES_SHA: ${{ inputs.sha }}
        run: |
          if [ "$SOURCE" = urgent ]; then
            echo "Urgent deploy (asked by the owner): the latest main goes live."
            echo "go=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ -z "$YES_SHA" ] || [ "$MAIN" != "$YES_SHA" ]; then
            echo "::warning title=Not updated::main (${MAIN:0:8}) is not the version the owner said yes to (${YES_SHA:0:8}). Nothing goes live."
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the version live: the last run whose « deploy » job really ran and passed (a night with nothing to do, or a
          # red main, also ends green, with that job skipped: it does not count)
          LIVE=""
          for id in $(gh run list -R "$REPO" --workflow deploy.yml --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            if [ "$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length')" != 0 ]; then
              LIVE=$(gh run view "$id" -R "$REPO" --json headSha --jq .headSha)
              break
            fi
          done
          CI=$(gh run list -R "$REPO" --workflow build.yml --branch main --commit "$MAIN" --event push --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          echo "main: ${MAIN:0:8} · live: ${LIVE:0:8} · CI on main: ${CI:-none}"
          if [ "$MAIN" = "$LIVE" ]; then
            echo "Nothing new tonight: the live version is the latest main."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$CI" != "completed success" ]; then
            echo "::warning title=Not updated tonight::Pilotix CI has not passed on the latest main (${MAIN:0:8}: ${CI:-no run}). It goes live the night after its fix, or with « Run workflow » if the owner asks."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Update pilotix.online
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          # the server's own SSH key (the « Host key: » line of an update, saved as the secret DEPLOY_KNOWN_HOSTS: its
          # type and key, the server's address is added here): with it, a machine pretending to be the server is refused
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "Missing the secrets DEPLOY_HOST / DEPLOY_SSH_KEY: run deploy/setup-github-deploy.sh on the server first."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN" ]; then
            # a line with only « type key » (ssh-ed25519 AAAA…) gets the server's address in front; a full line stays as it is
            printf '%s\n' "$KNOWN" | sed -E "s/^(Host key: )?//; /^(ssh-|ecdsa-)/s|^|$HOST |" > ~/.ssh/known_hosts
            CHECK=yes
          else
            CHECK=accept-new
            echo "::warning title=SSH::No DEPLOY_KNOWN_HOSTS secret: the server's key is not checked"
          fi
          set -o pipefail
          # (e-mail addresses are hidden in the run's log: anyone can read it while the code is public)
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=$CHECK -o ServerAliveInterval=30 "root@$HOST" update 2>&1 | sed -u -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' | tee update.log

      # the server could log in to its e-mail server (red here, but the deploy itself is done: see the line it wrote)
      - name: E-mails work on the server
        continue-on-error: true
        run: |
          # the e-mail line first, as its own note (GitHub shows only 10 notes per step: the last lines were cut off)
          # (the e-mail account's address is hidden: the run's notes can be seen by anyone while the code is public)
          line=$(grep -h -A1 '^E-mail:' update.log | tr '\n' ' ' | sed -E 's/  +/ /g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g')
          if grep -q '^E-mail: OK' update.log; then echo "::notice title=E-mail::$line"; else echo "::warning title=E-mail::${line:-no « E-mail: » line in the update}"; fi
          grep -v '^E-mail:' update.log | tail -n 8 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g; s/^/::notice title=Server update::/'
          grep -q '^E-mail: OK' update.log

      # the server checked itself during the update (on the server, before Cloudflare): the proof the new version runs,
      # even when Cloudflare's bot protection does not let the outside check below in
      - name: The new version answers on the server
        run: |
          grep -h '^Server:' update.log || echo "No « Server: » line in the update (an older install.sh)"
          grep -q '^Server: OK' update.log

      # the real site, from outside, without changing anything in it: the server and the website are this version,
      # and each public door answers as it should (scripts/live-check.mjs)
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # straight to the server at its own address, not through Cloudflare: Cloudflare's bot protection answers
      # « Just a moment… » to robots like this checker (its HTTPS certificate is the site's, so nothing else changes)
      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_URL || 'https://pilotix.online' }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          DOM=$(echo "$SITE" | sed -E 's#^https?://([^/:]+).*#\1#')
          IP=$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}')
          if [ -n "$IP" ]; then
            echo "::add-mask::$IP"
            echo "$IP $DOM" | sudo tee -a /etc/hosts >/dev/null
            echo "Checking $DOM on the server itself (not through Cloudflare)"
          fi
          node scripts/live-check.mjs
