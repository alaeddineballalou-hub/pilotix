name: Payment plans V2 focused regression checks
on:
  push:
    branches: [feat/payment-plans-four-tabs-v2]
jobs:
  payment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @pilotix/shared
      - run: npm run build -w @pilotix/core
      - run: node --test packages/core/dist/test/managementplans.test.js packages/core/dist/test/agencyplans.test.js packages/core/dist/test/paymentplans-v2.test.js
