# Pilotix watcher (owner's ask, 14 Nov 2026): every 5 minutes, from GitHub's computers (outside Algeria), test each
# layer separately and write one line to watch/log.csv on the « watch » branch, so every cut has a time and a place:
#   dns     pilotix.online still points to Cloudflare
#   cf      Cloudflare answers by itself (/cdn-cgi/trace never touches the server)
#   via_cloudflare  the code the site answers through Cloudflare (/healthz): 200 ok, 403 Cloudflare's robot check
#                   (Cloudflare is up), 520-526 Cloudflare cannot reach the server, 000 nothing answered
#   server_web      the site straight on the server, skipping Cloudflare (like the deploy's live check)
#   server_alive    the Contabo server's SSH door answers (nothing is logged in, nothing runs on it)
# The server's address stays secret: only « ok » or « fail » is written.
# GitHub may start a run a few minutes late or skip one when it is busy: a missing line is not a cut.
name: Pilotix watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test every layer
        id: t
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          when=$(TZ=Africa/Algiers date '+%Y-%m-%d %H:%M')
          ips=$(getent ahostsv4 pilotix.online | awk '{print $1}' | sort -u | tr '\n' ' ')
          case "$ips" in *104.*|*172.*) dns=ok ;; '') dns=fail ;; *) dns="other" ;; esac
          if curl -fsS -m 15 https://pilotix.online/cdn-cgi/trace | grep -q '^h=pilotix.online'; then cf=ok; else cf=fail; fi
          # through Cloudflare: 200 ok, 403 = Cloudflare's robot check (Cloudflare is up, the robot is stopped there),
          # 520-526 = Cloudflare cannot reach the server, 000 = nothing answered
          via=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://pilotix.online/healthz?w=$(date +%s)") || true
          host=${HOST#*@}; host=${host%%:*}
          ip=$(getent ahostsv4 "$host" | awk 'NR==1{print $1}')
          [ -n "$ip" ] && echo "::add-mask::$ip"
          # straight to the server, skipping Cloudflare (same certificate, same site), like the deploy's live check
          read -r direct secs < <(curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}' --resolve "pilotix.online:443:$ip" "https://pilotix.online/healthz?w=$(date +%s)" || echo "000 -") || true
          [ "$direct" = 200 ] && server_web=ok || server_web="fail-$direct"
          if [ -n "$ip" ] && timeout 8 bash -c "</dev/tcp/$ip/22" 2>/dev/null; then server=ok; else server=fail; fi
          line="$when,$dns,$cf,$via,$server_web,$server,${secs:-}"
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          {
            echo "| time (Algiers) | dns | cloudflare | via cloudflare | server web | server | server time (s) |"
            echo "|---|---|---|---|---|---|---|"
            echo "| ${line//,/ | } |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the line to the watch branch
        env:
          LINE: ${{ steps.t.outputs.line }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global user.name pilotix-watch
          git config --global user.email pilotix-watch@users.noreply.github.com
          for try in 1 2 3; do
            rm -rf w
            if git clone -q --depth 1 --branch watch "https://x-access-token:$TOKEN@github.com/$REPO" w 2>/dev/null; then :; else
              mkdir w && cd w && git init -q -b watch && git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO" && cd ..
            fi
            cd w
            mkdir -p watch
            [ -f watch/log.csv ] || echo "time_algiers,dns,cloudflare,via_cloudflare,server_web,server_alive,server_seconds" > watch/log.csv
            echo "$LINE" >> watch/log.csv
            git add watch/log.csv
            git commit -qm "watch: $LINE"
            if git push -q origin watch; then exit 0; fi
            cd ..
            sleep 5
          done
          echo "::warning::could not write the line (it is still in this run's summary)"
