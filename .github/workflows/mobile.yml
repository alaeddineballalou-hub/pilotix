name: Pilotix app

# Builds the Android test app when something in mobile/ changes.
# Website-only changes build nothing here: the app opens the live pilotix.online, so they show up in the app by themselves.
# Each app built on main goes on the download page with its version card (app-version.json): the server reads it and the
# phones offer « Nouvelle version de l'app » (the app updates itself: website lib/appUpdate, AppUpdatePlugin.java).
on:
  push:
    paths:
      - 'mobile/**'
      - '!mobile/**/*.md' # notebook updates don't need a new app
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    permissions:
      contents: write # puts the APK on the "app-test" download page (Releases)
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/app/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci --no-audit --no-fund
      # the small « Pilotix app · test N (abc1234) » line at the bottom of the app's start and error pages
      - run: echo "window.PILOTIX_BUILD = 'test ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})';" > www/build.js
      - run: npx cap sync android
      # The same key on every build lets a new app install over the old one (Android refuses an app signed by another key).
      # GitHub makes it itself, the same each time, from the server key it already keeps (DEPLOY_SSH_KEY): nobody pastes a
      # key (scripts/app-key.mjs). A keystore in the secret ANDROID_TEST_KEYSTORE_BASE64 would come first.
      # Changing DEPLOY_SSH_KEY changes the app key: every phone then installs the app again by hand once.
      # The build signs with it through PILOTIX_KEYSTORE (android/app/build.gradle); « The app's key » checks it did.
      - name: App signing key
        env:
          KEY: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          SEED: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KS="$RUNNER_TEMP/pilotix.keystore"
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > "$KS"
            echo "app key: from ANDROID_TEST_KEYSTORE_BASE64"
          elif [ -n "$SEED" ]; then
            D=$(mktemp -d)
            node scripts/app-key.mjs "$D"
            openssl pkcs12 -export -inkey "$D/key.pem" -in "$D/cert.pem" -name androiddebugkey -passout pass:android -out "$KS"
            rm -rf "$D"
            echo "app key: made from DEPLOY_SSH_KEY"
          else
            echo "app key: a new one for this build only (it can't replace the app on phones)"
            [[ "$GITHUB_REF" != refs/heads/main ]] || exit 1
            exit 0
          fi
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey
          echo "PILOTIX_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "KEY_SHA256=$(keytool -exportcert -keystore "$KS" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Build the test app
        working-directory: mobile/android
        # GitHub's build number is the app's version code: each new app is « newer » for Android and for the updater
        env:
          PILOTIX_BUILD: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pilotix-test.apk
      # which key signed the app (public: any phone shows it). With a fixed key, the app must carry it, or nothing is
      # published: a card saying « fixed key » on an app signed by another key would send the phones a failing update.
      - name: The app's key
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$SIGNER" verify --print-certs pilotix-test.apk | grep -m1 -i 'certificate SHA-256 digest' | grep -oE '[0-9a-f]{64}' | head -1)
          echo "the app is signed by the certificate $GOT"
          if [[ "$GITHUB_REF" == refs/heads/main && "$GOT" != 7217a246407e53084e76151f694bbfe9f53f60118fdddc2118a88c7adbe22c7f ]]; then
            echo "::error::Signer differs from published build 24. Restore the original key."; exit 1
          fi
          if [ -n "${KEY_SHA256:-}" ]; then
            if [ "$GOT" != "$KEY_SHA256" ]; then echo "::error::the app is not signed with the fixed key"; exit 1; fi
            echo "the fixed key: yes"
            echo "FIXED_KEY=true" >> "$GITHUB_ENV"
          fi
      - name: Verify in-place Android upgrade from the published APK
        if: github.ref == 'refs/heads/main'
        run: |
          # adb (platform-tools) is not on the runner's PATH: without this every adb call is « command not found »
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # avdmanager and the emulator look for the test phone in the same folder (as reactivecircus/android-emulator-runner
          # does); before, the emulator never answered adb within 300 s and the cause was not shown
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          curl -fLsS --retry 3 https://github.com/alaeddineballalou-hub/pilotix/releases/download/app-test/pilotix-test.apk -o "$RUNNER_TEMP/previous.apk"
          # GitHub's way to let the emulator use the processor's virtualisation (KVM)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm; df -h "$HOME" | tail -1
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$SDK/sdkmanager" --licenses >/dev/null || true
          "$SDK/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64' >/dev/null
          echo no | "$SDK/avdmanager" create avd -n update-test -k 'system-images;android-30;google_apis;x86_64' --force
          LOG="$RUNNER_TEMP/emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd update-test -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot >"$LOG" 2>&1 &
          trap 'adb emu kill >/dev/null 2>&1 || true' EXIT
          booted() { [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; }
          # up to 10 minutes; if it does not start, the emulator's own words are shown here
          for i in $(seq 1 120); do
            if booted; then echo "the test phone started in about $((i * 5)) s"; break; fi
            if ! pgrep -f 'avd update-test' >/dev/null; then echo "::error::the Android emulator stopped by itself"; tail -40 "$LOG"; exit 1; fi
            if [ $((i % 12)) -eq 0 ]; then echo "still starting ($((i * 5)) s): $(adb devices | tail -n +2 | tr '\n' ' ')"; tail -2 "$LOG"; fi
            sleep 5
          done
          if ! booted; then echo "::error::the Android emulator did not start in 10 minutes"; tail -60 "$LOG"; exit 1; fi
          # Android's app installer answers a little after the start
          for i in $(seq 1 30); do adb shell pm path android >/dev/null 2>&1 && break; sleep 2; done
          adb install "$RUNNER_TEMP/previous.apk"
          adb shell run-as com.pilotix.app touch files-upgrade-marker
          adb install -r pilotix-test.apk
          adb shell run-as com.pilotix.app test -f files-upgrade-marker
      # the app's version card: its build, commit, date, size, and whether it has the fixed key (only then can it replace
      # the app on a phone; before, Android refuses and the phones are not asked to update)
      - name: Version card
        run: |
          printf '{"build":%s,"sha":"%s","date":"%s","size":%s,"fixedKey":%s}\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(stat -c %s pilotix-test.apk)" "${FIXED_KEY:-false}" > app-version.json
          cat app-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilotix-android-test
          path: mobile/pilotix-test.apk
      # one stable link for the latest test app:
      # https://github.com/<owner>/<repo>/releases/download/app-test/pilotix-test.apk
      # only main's apps: a side branch (or a robot's dependency update) never replaces the phones' app
      - name: Put it on the download page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Test version of the Pilotix Android app, version ${GITHUB_RUN_NUMBER}, from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M') UTC.
          To install: open this page on the Android phone, tap pilotix-test.apk, then Install (allow Chrome to install apps if the phone asks)."
          gh release delete app-test --yes --cleanup-tag || true
          gh release create app-test pilotix-test.apk app-version.json --target "$GITHUB_SHA" --prerelease --title "Pilotix app (test version)" --notes "$NOTES"
