# Temporary (for Claude): does the live server answer Meta's data deletion address? Changes nothing.
name: Live now 2 (temporary, for Claude)
on:
  push:
    branches: ['check/live-claude']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Meta's data deletion address, through Cloudflare and straight from the server
        run: |
          for base in https://pilotix.online https://direct.pilotix.online; do
            c=$(curl -s -m 30 -o /tmp/p.html -w '%{http_code}' "$base/api/hooks/meta-deletion/NOPE1234" || echo failed)
            echo "::notice title=Page of an unknown code, $base::HTTP $c · says unknown code: $(grep -c 'Unknown request code' /tmp/p.html || true) · Cloudflare challenge: $(grep -c 'Just a moment' /tmp/p.html || true)"
            c=$(curl -s -m 30 -o /tmp/q.json -w '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'signed_request=abc.def' "$base/api/hooks/meta-deletion" || echo failed)
            echo "::notice title=Request with a wrong signature, $base::HTTP $c · $(head -c 120 /tmp/q.json | tr -d '\n')"
          done
