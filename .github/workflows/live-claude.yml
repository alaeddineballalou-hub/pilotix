# Temporary (for Claude): which version of the app page does Cloudflare give to visitors? Reads only.
name: Live now 2 (temporary, for Claude)
on:
  push:
    branches: ['check/live-claude']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: The app page, through Cloudflare and straight from the server
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          t() {
            c=$(curl -s -m 30 -A "$UA" -H 'Accept: text/html' -D /tmp/h.txt -o /tmp/b.html -w '%{http_code}' "$1" || echo failed)
            h() { grep -i "^$1:" /tmp/h.txt | head -1 | tr -d '\r' | cut -d' ' -f2-; }
            js=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' /tmp/b.html | head -1)
            echo "::notice title=$2::$c · script ${js:-none} · cf-cache-status=$(h cf-cache-status) · age=$(h age) · cache-control=$(h cache-control) · last-modified=$(h last-modified) · challenge=$(grep -c 'Just a moment' /tmp/b.html || true)"
          }
          t 'https://direct.pilotix.online/demo/accueil' 'Server itself /demo/accueil'
          t 'https://direct.pilotix.online/' 'Server itself /'
          t 'https://pilotix.online/' 'Cloudflare /'
          t 'https://pilotix.online/index.html' 'Cloudflare /index.html'
          t 'https://pilotix.online/demo/accueil' 'Cloudflare /demo/accueil'
          t 'https://pilotix.online/demo/comptes' 'Cloudflare /demo/comptes'
          t "https://pilotix.online/demo/comptes?fresh=$RANDOM" 'Cloudflare /demo/comptes?fresh'
          t 'https://pilotix.online/demo/accueil' 'Cloudflare /demo/accueil (again)'
