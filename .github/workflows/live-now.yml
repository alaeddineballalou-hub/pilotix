# Temporary (for Claude): does the live site serve the new Facebook / TikTok parts of #/conditions? Reads only.
name: Live now (temporary, for Claude)
on:
  push:
    branches: ['check/live-now']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pilot AI tabs on the live site
        run: |
          code=$(curl -s -m 40 -A 'Mozilla/5.0' -o /tmp/index.html -w '%{http_code}' https://direct.pilotix.online/ || echo failed)
          echo "::notice title=Site index::$code"
          # every script of the app, followed from the page (the control room is a chunk loaded later)
          mkdir -p /tmp/js; : > /tmp/seen
          grep -o 'assets/[A-Za-z0-9._-]*\.js' /tmp/index.html | sort -u > /tmp/todo
          n=0
          while [ -s /tmp/todo ] && [ $n -lt 200 ]; do
            a=$(head -1 /tmp/todo); sed -i 1d /tmp/todo
            grep -qx "$a" /tmp/seen && continue
            echo "$a" >> /tmp/seen; n=$((n+1))
            f="/tmp/js/$(basename "$a")"
            curl -s -m 60 -A 'Mozilla/5.0' "https://direct.pilotix.online/$a" -o "$f" || continue
            grep -o 'assets/[A-Za-z0-9._-]*\.js' "$f" | sort -u | while read b; do grep -qx "$b" /tmp/seen || echo "$b" >> /tmp/todo; done
            grep -o '"[A-Za-z0-9._-]*\.js"' "$f" | tr -d '"' | grep -E '^[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8}\.js$' | sed 's#^#assets/#' | while read b; do grep -qx "$b" /tmp/seen || echo "$b" >> /tmp/todo; done
          done
          echo "::notice title=Scripts read::$n"
          for m in business_tools 'Intégrations professionnelles' px-legal-steps sdel; do
            hit=$(grep -l "$m" /tmp/js/*.js 2>/dev/null | head -1)
            echo "::notice title=js $m::$([ -n "$hit" ] && echo "live (in $(basename "$hit"))" || echo 'not found')"
          done
          css=$(grep -o 'assets/[A-Za-z0-9._-]*\.css' /tmp/index.html | head -1); echo "::notice title=Main css::$css"
          for c in $(cat /tmp/js/*.js /tmp/index.html | grep -o 'assets/[A-Za-z0-9._-]*\.css' | sort -u); do curl -s -m 40 -A 'Mozilla/5.0' "https://direct.pilotix.online/$c" >> /tmp/all.css; done
          for m in px-legal-steps cpt-link; do echo "::notice title=css $m::$(grep -c "$m" /tmp/all.css 2>/dev/null || true)"; done
          art=$(ls /tmp/js | grep -c '^art-ltr-' || true); echo "::notice title=Learning bench picture loaded by the page::$art"
      - name: The conditions page for Meta
        run: |
          # Pilotix's own text in the control room: when it is not empty it replaces the standard parts (the Facebook parts still show)
          curl -s -m 30 -A 'Mozilla/5.0' https://direct.pilotix.online/api/legal -o /tmp/legal.json || true
          echo "::notice title=Own conditions text (characters, 0 = standard text)::$(jq -r '.text | length' /tmp/legal.json 2>/dev/null || echo 'no answer')"
          echo "::notice title=Contact e-mail set::$(jq -r 'if (.email // "") == "" then "no (contact@pilotix.online shown)" else "yes" end' /tmp/legal.json 2>/dev/null || echo 'no answer')"
          # what Meta's robot gets when it checks the address (through Cloudflare, with its own name)
          for ua in 'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)' 'Mozilla/5.0'; do
            c=$(curl -s -m 30 -A "$ua" -o /tmp/home.html -w '%{http_code}' 'https://pilotix.online/' || echo failed)
            echo "::notice title=pilotix.online for ${ua%% *}::$c, $(wc -c < /tmp/home.html 2>/dev/null || echo 0) bytes, title: $(grep -o '<title>[^<]*' /tmp/home.html 2>/dev/null | head -1 | sed 's/<title>//')"
          done
