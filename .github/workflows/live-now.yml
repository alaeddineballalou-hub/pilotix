# Temporary (for Claude): « Ce site est inaccessible » for some users — DNS, DNSSEC and connection tests from outside. Reads only.
name: Live now (temporary, for Claude)
on:
  push:
    branches: ['check/live-now']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS of pilotix.online from the big public resolvers
        run: |
          for r in 'Google 8.8.8.8' 'Cloudflare 1.1.1.1' 'Quad9 9.9.9.9' 'OpenDNS 208.67.222.222'; do
            n=${r%% *}; ip=${r#* }
            st=$(dig +time=5 +tries=2 pilotix.online A @$ip | grep -o 'status: [A-Z]*' | head -1)
            fl=$(dig +time=5 +tries=2 pilotix.online A @$ip | grep -o 'flags: [a-z ]*' | head -1)
            cnt=$(dig +short +time=5 +tries=2 pilotix.online A @$ip | grep -c '\.' || true)
            cd=$(dig +cd +time=5 +tries=2 pilotix.online A @$ip | grep -o 'status: [A-Z]*' | head -1)
            echo "::notice title=DNS via $n::$st, $fl, $cnt addresses, without DNSSEC check: $cd"
          done
          echo "::notice title=Name servers::$(dig +short NS pilotix.online @8.8.8.8 | tr '\n' ' ')"
          echo "::notice title=DNSSEC at the registry (DS)::$(dig +short DS pilotix.online @8.8.8.8 | cut -d' ' -f1-3 | tr '\n' ';' )"
          ns=$(dig +short NS pilotix.online @8.8.8.8 | head -1)
          echo "::notice title=DNSSEC keys at the name server (DNSKEY)::$(dig +short DNSKEY pilotix.online @$ns | wc -l) keys"
          echo "::notice title=www.pilotix.online::$(dig +short www.pilotix.online A @8.8.8.8 | grep -c '\.' || true) addresses, $(dig www.pilotix.online A @8.8.8.8 | grep -o 'status: [A-Z]*' | head -1)"
          echo "::notice title=IPv6 (AAAA) of pilotix.online::$(dig +short pilotix.online AAAA @8.8.8.8 | grep -c ':' || true) addresses"
          echo "::notice title=Dates (SOA serial)::$(dig +short SOA pilotix.online @8.8.8.8 | cut -d' ' -f1,3)"
      - name: 30 new connections through Cloudflare, 30 straight to the server
        run: |
          t() { ok=0; bad=0; slow=0; codes=''; max=0
            for i in $(seq 1 30); do
              o=$(curl -s -m 20 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code} %{time_connect} %{time_total}' "$1" || echo "000 0 20")
              c=${o%% *}; tt=${o##* }
              codes="$codes $c"
              [ "$c" = "000" ] && bad=$((bad+1)) || ok=$((ok+1))
              awk -v x="$tt" 'BEGIN{exit !(x>5)}' && slow=$((slow+1))
              max=$(awk -v a="$max" -v b="$tt" 'BEGIN{print (b>a)?b:a}')
              sleep 1
            done
            echo "::notice title=$2::$ok answered, $bad no answer, $slow slower than 5 s, slowest ${max} s, codes:$(echo $codes | tr ' ' '\n' | sort | uniq -c | tr '\n' ' ')"; }
          t 'https://pilotix.online/' 'Through Cloudflare (home page)'
          t 'https://pilotix.online/api/hooks/courier/1' 'Through Cloudflare (an api address)'
          t 'https://direct.pilotix.online/' 'Straight to the server (home page)'
          echo "::notice title=HTTP/3 offered by Cloudflare::$(curl -sI -m 20 https://pilotix.online/api/hooks/courier/1 | grep -i '^alt-svc' | tr -d '\r' | cut -c1-80)"
          echo "::notice title=Runner seen by Cloudflare as::$(curl -s -m 20 https://pilotix.online/cdn-cgi/trace | grep -E '^(loc|colo|http|tls)=' | tr '\n' ' ')"
