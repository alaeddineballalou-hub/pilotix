# Temporary (for Claude): does the live site serve the newest control room (Pilot AI tabs)? Reads only.
name: Live now (temporary, for Claude)
on:
  push:
    branches: ['check/live-now']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pilot AI tabs on the live site
        run: |
          curl -s -m 40 https://pilotix.online/ -o /tmp/index.html || echo "::notice title=Site::index not reached"
          found=0
          for a in $(grep -o 'assets/[A-Za-z0-9._-]*\.js' /tmp/index.html | sort -u); do
            curl -s -m 60 "https://pilotix.online/$a" -o /tmp/a.js || continue
            if grep -q 'p.dellal.board' /tmp/a.js; then found=1; fi
          done
          # the control room is in its own chunk: look in every chunk the entry names too
          for a in $(cat /tmp/a.js 2>/dev/null | grep -o 'assets/[A-Za-z0-9._-]*\.js' | sort -u | head -80); do
            curl -s -m 60 "https://pilotix.online/$a" -o /tmp/c.js || continue
            if grep -q 'p.dellal.board' /tmp/c.js; then found=1; fi
          done
          echo "::notice title=Pilot AI tabs::$([ $found = 1 ] && echo 'live (p.dellal.board in the served app)' || echo 'not found in the served app')"
          r=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://pilotix.online/api/platform/rpc/p.dellal.board || echo failed)
          echo "::notice title=API p.dellal.board without a session::$r (401 = the route is there and asks for a login)"
