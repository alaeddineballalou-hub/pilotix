<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Pilotix · Vos pubs</title>
    <link rel="stylesheet" href="adspanel.css" />
  </head>
  <body>
    <button id="pill" type="button" class="pill" aria-expanded="false">
      <img src="icons/icon32.png" alt="" width="18" height="18" />
      <span id="pillText">Pilotix</span>
      <span class="chev" aria-hidden="true">▴</span>
    </button>
    <section id="panel" class="panel" hidden>
      <header>
        <img src="icons/icon32.png" alt="" width="24" height="24" />
        <div class="who">
          <b>Vos pubs dans Pilotix</b>
          <span id="sub">Commandes confirmées, livrées et coût par confirmée</span>
        </div>
        <select id="days" aria-label="Période">
          <option value="7">7 jours</option>
          <option value="14">14 jours</option>
          <option value="30">30 jours</option>
        </select>
        <button id="close" type="button" class="icon" aria-label="Réduire">▾</button>
      </header>
      <p id="msg" class="msg" role="status"></p>
      <ul id="list"></ul>
      <p class="foot">Une commande compte pour une pub quand elle est venue par son lien. Bid limit : celui du produit dans Pilotix › Lancer une pub.</p>
    </section>
    <script type="module" src="adspanel.js"></script>
  </body>
</html>
